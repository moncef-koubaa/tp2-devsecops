name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Pipeline de base : installation, compilation et tests unitaires
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Compilation (vérification syntaxique)
        run: python -m compileall -q app
      - name: Tests unitaires
        run: pytest -v

  # 2. SAST : analyse statique du code avec Bandit
  sast:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.6
      - name: Rapport Bandit complet
        run: bandit -r app -f json -o bandit-report.json --exit-zero
      - name: Garde-fou SAST (échec si sévérité HIGH)
        run: bandit -r app --severity-level high --confidence-level medium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # 3. SCA : analyse des dépendances avec Trivy
  sca:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Garde-fou SCA (échec si CVE HIGH ou CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 fs /src \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table

  # 4. DAST : déploiement éphémère + scan OWASP ZAP
  dast:
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t tp2-app:${{ github.sha }} .
      - name: Scan de l'image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 tp2-app:${{ github.sha }}
      - name: Déployer l'environnement éphémère
        run: |
          docker run -d --name tp2-app -p 5000:5000 tp2-app:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 1; done
      - name: Scan DAST OWASP ZAP (API scan actif)
        run: |
          chmod -R a+w .
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t openapi.yaml -f openapi -O http://localhost:5000 \
            -J zap-report.json -r zap-report.html -I
      - name: Garde-fou DAST (échec si alerte High)
        run: python3 scripts/zap_gate.py zap-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.*
      - name: Détruire l'environnement éphémère
        if: always()
        run: docker rm -f tp2-app
